name: 基础检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Go 测试、1 GiB 日志基准与前端构建
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Wails Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: 整理并下载 Go 依赖
        run: go mod tidy

      - name: Go 静态检查
        run: go vet ./...

      - name: 运行完整 Go 单元测试
        run: go test ./...

      - name: Go 并发数据竞争检查
        run: go test -race ./...

      - name: GB 级大文件检索基准测试（1 GiB）
        env:
          METEORDESK_BENCH_SIZE_MB: 1024
        run: go test ./internal/logx -run '^$' -bench BenchmarkSearchFileLargeLog -benchtime=1x -benchmem

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 前端依赖安全审计（高危/严重告警阻断构建）
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > "$RUNNER_TEMP/meteor-desk-npm-audit.json"
          audit_status=$?
          set -e
          node - "$RUNNER_TEMP/meteor-desk-npm-audit.json" <<'NODE'
          const fs = require('node:fs')
          let report
          try { report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')) } catch {
            console.error('npm audit 未返回可解析报告；请检查 npm registry 连接。')
            process.exit(1)
          }
          const summary = report.metadata?.vulnerabilities
          if (!summary) {
            console.error(report.error?.summary || 'npm audit 未返回漏洞摘要。')
            process.exit(1)
          }
          console.log('npm audit 漏洞摘要:', JSON.stringify(summary))
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map(v => typeof v === 'string' ? v : { title: v.title, url: v.url, range: v.range }) }))
          }
          NODE
          exit "$audit_status"

      - name: 运行前端单元与交互测试
        working-directory: frontend
        run: npm test

      - name: 检查类型并构建前端
        working-directory: frontend
        run: npm run build

  desktop-build:
    name: 桌面构建 (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Linux 桌面依赖
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: 安装桌面构建所需的前端依赖
        working-directory: frontend
        run: npm install

      - name: 整理并下载目标平台 Go 依赖
        run: go mod tidy

      - name: 在目标操作系统运行 Go 单元测试
        run: go test ./...

      - name: 构建本机桌面应用
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.10.2 build -clean

      - name: 上传桌面构建产物
        uses: actions/upload-artifact@v4
        with:
          name: meteor-desk-${{ runner.os }}
          path: build/bin/**
          if-no-files-found: error
          retention-days: 7
