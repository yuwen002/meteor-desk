name: 基础检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Go 单元测试与前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行日志检索和进程模型测试
        run: go test ./internal/logx ./internal/process

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 检查类型并构建前端
        working-directory: frontend
        run: npm run build
