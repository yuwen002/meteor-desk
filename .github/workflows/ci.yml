name: 基础检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Go 测试、性能基准与前端构建
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Wails Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 整理并下载 Go 依赖
        run: go mod tidy

      - name: 运行完整 Go 单元测试
        run: go test ./...

      - name: 大文件检索基准测试（64 MiB）
        run: go test ./internal/logx -run '^$' -bench BenchmarkSearchFileLargeLog -benchtime=1x -benchmem

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 检查类型并构建前端
        working-directory: frontend
        run: npm run build
