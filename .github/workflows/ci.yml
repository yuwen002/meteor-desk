name: 基础检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Go 静态检查、测试、1 GiB 日志基准与前端构建
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Wails Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: 下载并校验 Go 依赖
        run: |
          go mod download
          go mod verify

      - name: Go 代码格式化检查（gofmt -s）
        shell: bash
        run: |
          # 仓库只用 .gitattributes 把 *.sh 固定为 LF，Go 文件沿用既有行尾策略；Linux Runner 检出为 LF，因此这里不会因行尾差异误报。
          files=$(find . -type f -name '*.go' -not -path './frontend/*' -not -path './build/*' -not -path './node_modules/*')
          unformatted=$(gofmt -l -s $files)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件不符合 gofmt -s 规范，请本地执行 gofmt -w -s 后重新提交："
            echo "$unformatted"
            for file in $unformatted; do
              echo "--- $file ---"
              gofmt -d -s "$file"
            done
            exit 1
          fi
          echo "gofmt 检查通过（$(echo "$files" | wc -l) 个 Go 文件）"

      - name: Go 静态检查
        run: go vet ./...

      - name: golangci-lint 静态分析（errcheck / staticcheck / unused 等）
        uses: golangci/golangci-lint-action@v9
        with:
          # 与根目录 .golangci.yml（v2 配置格式）配套；二进制由 action 直接下载，不要求 Runner 升级到 Go 1.26。
          version: v2.15
          args: --timeout=5m

      - name: 运行完整 Go 单元测试（同时采集覆盖率）
        # 覆盖率采集不单独再跑一轮测试：复用本次完整用例运行的 profile。
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Go 覆盖率汇总与下限门槛
        shell: bash
        env:
          # 当前总覆盖率约 74.6%，预留约 4 个百分点余量；调高前先补齐测试。
          COVERAGE_FLOOR: "70"
          COVERAGE_DROP_TOLERANCE: "2"
        run: bash scripts/coverage-check.sh coverage.out

      - name: 日志事件聚合回归测试
        run: go test ./internal/logx -run '^TestEventAggregation|^TestSearchFileEventContext'

      - name: Go 并发数据竞争检查
        run: go test -race ./...

      - name: GB 级大文件检索基准测试（1 GiB）
        env:
          METEORDESK_BENCH_SIZE_MB: 1024
        run: go test ./internal/logx -run '^$' -bench BenchmarkSearchFileLargeLog -benchtime=1x -benchmem

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端依赖安全审计（高危/严重告警阻断构建）
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > "$RUNNER_TEMP/meteor-desk-npm-audit.json"
          audit_status=$?
          set -e
          node - "$RUNNER_TEMP/meteor-desk-npm-audit.json" <<'NODE'
          const fs = require('node:fs')
          let report
          try { report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')) } catch {
            console.error('npm audit 未返回可解析报告；请检查 npm registry 连接。')
            process.exit(1)
          }
          const summary = report.metadata?.vulnerabilities
          if (!summary) {
            console.error(report.error?.summary || 'npm audit 未返回漏洞摘要。')
            process.exit(1)
          }
          console.log('npm audit 漏洞摘要:', JSON.stringify(summary))
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map(v => typeof v === 'string' ? v : { title: v.title, url: v.url, range: v.range }) }))
          }
          NODE
          exit "$audit_status"

      - name: 运行前端单元与交互测试
        working-directory: frontend
        run: npm test

      - name: 前端 ESLint 检查
        working-directory: frontend
        # 存量已清零（4 条错误已修复），因此直接作为阻断门禁，避免新代码重新积累同类问题。
        # --format github 会把命中项输出为 PR 行内注释。
        run: npm run lint -- --format=github

      - name: 检查类型并构建前端
        working-directory: frontend
        run: npm run build

  desktop-build:
    name: 桌面构建 (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Linux 桌面依赖
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装桌面构建所需的前端依赖
        working-directory: frontend
        run: npm ci

      - name: 下载并校验目标平台 Go 依赖
        run: |
          go mod download
          go mod verify

      - name: 在目标操作系统运行 Go 单元测试
        run: go test ./...

      - name: 构建本机桌面应用
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.10.2 build -clean

      - name: 上传桌面构建产物
        uses: actions/upload-artifact@v4
        with:
          name: meteor-desk-${{ runner.os }}
          path: build/bin/**
          if-no-files-found: error
          retention-days: 7
